<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انتخاب اپلیکیشن</title>
    <!-- استفاده از فونت وزیرمتن (ایران‌سنس) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #1B1F28;
            --btn-bg: #2C3340;
            --btn-text: #98B9DE;
            --btn-hover: #3A4354;
            --accent-blue: #2563EB;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        body {
            height: 100dvh;
            width: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            overflow: hidden;
        }

        h1 {
            font-size: clamp(20px, 6vw, 28px);
            margin-bottom: 40px;
            text-align: center;
            color: #ffffff;
            font-weight: 700;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 18px 20px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 16px;
            font-size: clamp(15px, 4.5vw, 18px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .app-btn:hover {
            background-color: var(--btn-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .app-btn:active {
            transform: translateY(0);
        }

        /* استایل مخصوص هر دکمه برای تمایز */
        .btn-724 {
            border-right: 4px solid #E51C74; /* رنگ برند 724 */
        }

        .btn-blu {
            border-right: 4px solid var(--accent-blue); /* رنگ برند بلو */
        }

        /* آیکون‌های داخل دکمه‌ها */
        .app-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* استایل لوگوی 724 */
        .logo-724 {
            font-size: 22px;
            font-weight: 900;
            color: #E51C74;
            letter-spacing: -1px;
        }

        /* استایل لوگوی بلو */
        .logo-blu {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-blue);
            letter-spacing: -1px;
        }

        .home-indicator {
            width: 130px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 10px;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <h1>انتخاب اپلیکیشن</h1>

    <div class="buttons-container">
        <!-- دکمه اپلیکیشن 724 -->
        <a href="pages/724.html" class="app-btn btn-724">
            <div class="logo-724">724</div>
            <span>اپلیکیشن ۷۲۴</span>
        </a>

        <!-- دکمه اپلیکیشن بلو بانک -->
        <a href="pages/blu.html" class="app-btn btn-blu">
            <div class="logo-blu">blu</div>
            <span>اپلیکیشن بلو بانک</span>
        </a>
    </div>

    <!-- نوار پایین صفحه -->
    <div class="home-indicator"></div>

</body>
</html>
