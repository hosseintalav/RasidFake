<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه رسیدساز تراکنش</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141923;
            --card-border: #1e2638;
            --text-main: #f0f4fc;
            --text-muted: #7987a1;
            --accent-blue: #2563eb;
            --accent-pink: #e51c74;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100dvh;
            width: 100%;
            background: radial-gradient(circle at 50% 20%, #171f30 0%, #0b0e14 75%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 32px 20px 24px 20px;
            color: var(--text-main);
        }

        .main-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto 0;
        }

        .header-section {
            text-align: center;
            margin-bottom: 34px;
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(37, 99, 235, 0.3);
            color: #60a5fa;
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .app-badge span.dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 8px #3b82f6;
        }

        h1 {
            font-size: clamp(21px, 5.5vw, 25px);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.4px;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .service-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .service-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .service-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .service-card:active {
            transform: translateY(0);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c2230;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .logo-box img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .text-content .title {
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .text-content .desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .arrow-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #19202e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .service-card:hover .arrow-icon {
            background: #2563eb;
            color: #ffffff;
            transform: translateX(-3px);
        }

        .footer-motto {
            text-align: center;
            margin-top: 24px;
        }

        .motto-text {
            font-size: 13px;
            color: #9ba7be;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 30px;
        }

        .motto-text svg {
            width: 16px;
            height: 16px;
            fill: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header-section">
            <div class="app-badge">
                <span class="dot"></span>
                <span>سریع، استاندارد و باکیفیت</span>
            </div>
            <h1>انتخاب قالب رسید بانکی</h1>
            <p class="subtitle">لطفاً اپلیکیشن مقصد را برای ایجاد و دانلود رسید انتخاب فرمایید</p>
        </div>

        <div class="cards-list">
            <!-- دکمه اپلیکیشن بلو بانک -->
            <a href="pages/blu.html" class="service-card">
                <div class="card-info">
                    <div class="logo-box">
                        <img src="images/blu.png" alt="بلو بانک" onerror="this.onerror=null; this.src='../images/blu.png';">
                    </div>
                    <div class="text-content">
                        <span class="title">رسید بلو بانک</span>
                        <span class="desc">قالب دقیق رسید انتقال بلو (blu)</span>
                    </div>
                </div>
                <div class="arrow-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </div>
            </a>

            <!-- دکمه اپلیکیشن 724 -->
            <a href="pages/724.html" class="service-card">
                <div class="card-info">
                    <div class="logo-box">
                        <img src="images/724.png" alt="724" onerror="this.onerror=null; this.src='../images/724.png';">
                    </div>
                    <div class="text-content">
                        <span class="title">رسید اپلیکیشن ۷۲۴</span>
                        <span class="desc">طرح رسمی کارت‌به‌کارت سپ</span>
                    </div>
                </div>
                <div class="arrow-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </div>
            </a>
        </div>
    </div>

    <!-- شعار همیشگی -->
    <div class="footer-motto">
        <div class="motto-text">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>شعار ما همیشه رایگان بودنه.</span>
        </div>
    </div>

</body>
</html>
