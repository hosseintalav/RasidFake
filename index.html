<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رسیدباز</title>
<link rel="icon" type="image/webp" href="images/icon-app.webp">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',-apple-system,Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;justify-content:center;
  color:#f5f5f7;
  background:#070a12;
  position:relative;overflow-x:hidden;
}
/* original black-blue gradient */
.wallpaper{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 20%, #171f30 0%, #0b0e14 75%)}

.shell{width:100%;max-width:400px;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.nav-title{font-size:13px;font-weight:700;color:#98989f}
.tg{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;
  background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 4px 16px rgba(0,0,0,.4);
  transition:.2s;
}
.tg:hover{background:rgba(255,255,255,.16)}
.tg:active{transform:scale(.94)}
.tg svg{width:17px;height:17px;fill:#fff}

/* hero */
.hero{text-align:center;margin-bottom:26px}
.icon{
  width:72px;height:72px;margin:0 auto 14px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -1px 6px rgba(0,0,0,.2), 0 12px 32px rgba(0,122,255,.35);
}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font-size:25px;font-weight:800;letter-spacing:-.4px;color:#fff}
.hero p{font-size:13px;color:#98989f;margin-top:6px}

/* dark liquid glass list */
.glass-group{
  border-radius:26px;overflow:hidden;
  background:rgba(255,255,255,.07);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 12px 32px rgba(0,0,0,.45);
}
.row{
  display:flex;align-items:center;gap:13px;
  padding:14px 16px;text-decoration:none;color:inherit;
  position:relative;transition:background .2s;
}
.row:hover{background:rgba(255,255,255,.07)}
.row:active{background:rgba(255,255,255,.1)}
.row + .row{border-top:1px solid rgba(255,255,255,.09)}
.thumb{width:52px;height:52px;border-radius:15px;overflow:hidden;flex-shrink:0;background:#fff;
  border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row-text{flex:1;min-width:0}
.row-text b{display:block;font-size:15px;font-weight:700;color:#fff}
.row-text span{font-size:12px;color:#98989f}
.chev{color:#6e6e73;flex-shrink:0}
.chev svg{width:18px;height:18px;display:block}

/* footer */
footer{margin-top:auto;padding-top:28px;text-align:center}
.motto{font-size:12px;color:#6e6e73}
.motto b{color:#aeaeb2;font-weight:700}
</style>
</head>
<body>
<div class="wallpaper"></div>

<div class="shell">
  <div class="nav">
    <span class="nav-title">رسیدباز</span>
    <a class="tg" href="https://t.me/w8i_7" target="_blank" rel="noopener" title="تلگرام">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    </a>
  </div>

  <div class="hero">
    <div class="icon"><img src="images/icon-app.webp" alt="رسیدباز"></div>
    <h1>انتخاب قالب رسید</h1>
    <p>اپلیکیشن مقصد را انتخاب کنید</p>
  </div>

  <div class="glass-group">
    <a href="pages/blu.html" class="row">
      <div class="thumb"><img src="images/blu.webp" alt="بلو"></div>
      <div class="row-text"><b>رسید بلو بانک</b><span>قالب انتقال بلو</span></div>
      <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>
    <a href="pages/724.html" class="row">
      <div class="thumb"><img src="images/724.webp" alt="724"></div>
      <div class="row-text"><b>رسید ۷۲۴</b><span>کارت‌به‌کارت سپ</span></div>
      <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>
  </div>

  <footer>
       <div class="motto"><b> رایگان و بدون محدودیت  </b></div>
  </footer>
</div>

</body>
</html>
