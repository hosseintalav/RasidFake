    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141923;

            --text-main: #f0f4fc;
            --text-muted: #7987a1;
            --accent-blue: #2563eb;
            --accent-pink: #e51c74;
        }

        * {

        }

        body {

            background: radial-gradient(circle at 50% 20%, #171f30 0%, #0b0e14 75%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 32px 20px 24px 20px;
            color: var(--text-main);
        }

        .main-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto 0;
        }

        .header-section {
            text-align: center;
            margin-bottom: 34px;
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(37, 99, 235, 0.12);
            border: 1px solid rgba(37, 99, 235, 0.3);
            color: #60a5fa;
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .app-badge span.dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 8px #3b82f6;
        }

        h1 {
            font-size: clamp(21px, 5.5vw, 25px);
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.4px;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .service-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .service-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .service-card:active {
            transform: translateY(0);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c2230;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .logo-box img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .text-content .title {
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .text-content .desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .arrow-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #19202e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .service-card:hover .arrow-icon {
            background: #2563eb;
            color: #ffffff;
            transform: translateX(-3px);
        }

        .footer-motto {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
        }

        .motto-text {
            font-size: 13px;
            color: #9ba7be;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .motto-text svg {
            width: 16px;
            height: 16px;
            fill: #38bdf8;
        }

        .telegram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #229ED9;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(34, 158, 217, 0.35);
        }

        .telegram-link:hover {
            transform: translateY(-2px) scale(1.08);
            box-shadow: 0 5px 14px rgba(34, 158, 217, 0.55);
        }

        .telegram-link:active {
            transform: translateY(0) scale(0.96);
        }

        .telegram-link svg {
            width: 17px;
            height: 17px;
            fill: #ffffff;
        }
    </style>
</head>
