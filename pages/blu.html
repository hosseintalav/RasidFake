<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صدور رسید بلو بانک</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1e29;
            --text-main: #ffffff;
            --text-muted: #858e9e;
            --accent-green: #02bd92;
            --line-color: #232a38;
            --btn-bg: #242b38;
            --btn-text: #8faecc;
            --help-bg: #5a94dd;
            
            --form-bg: #141318;
            --form-input-bg: #1E1C24;
            --form-border: #282630;
            --form-blue: #2563EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent !important;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            outline: none !important;
        }

        html, body {
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background-color: #08080a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .phone-container {
            width: 100%;
            max-width: 440px;
            height: 100dvh;
            background-color: var(--form-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.85);
        }

        /* فرم - بدون اسکرول */
        #form-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px 20px 20px 20px;
            overflow: hidden;
            justify-content: flex-start;
        }

        .form-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .back-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #1e1c24;
            color: #8E919A;
            border: 1px solid #282630;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-home-btn:hover {
            color: #ffffff;
            background: #2563EB;
            border-color: #2563EB;
        }

        .back-home-btn svg {
            width: 22px;
            height: 22px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .form-header h2 {
            font-size: 21px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .form-header p {
            font-size: 13.5px;
            color: #8E919A;
        }

        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13.5px;
            color: #CCCCCC;
            font-weight: 500;
        }

        .form-group input {
            background-color: var(--form-input-bg);
            border: 1px solid var(--form-border);
            border-radius: 12px;
            padding: 11px 14px;
            color: #ffffff;
            font-size: 14.5px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .form-group input:focus {
            border-color: var(--form-blue) !important;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.3) !important;
        }

        .input-with-btn {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-btn input {
            padding-left: 52px;
        }

        .dice-btn {
            position: absolute;
            left: 6px;
            background-color: #282630;
            border: 1px solid #3A3745;
            color: #3B82F6;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dice-btn svg {
            width: 22px;
            height: 22px;
        }

        .submit-btn {
            background-color: var(--form-blue);
            border: none;
            color: #ffffff;
            border-radius: 12px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
            width: 100%;
        }

        /* نمای رسید */
        #receipt-wrapper {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            justify-content: space-between;
        }

        .preview-outer {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 8px;
        }

        /* کادر با ابعاد دقیق ۹:۲۰ (450x1000) */
        #receipt-capture-area {
            width: 450px;
            height: 1000px;
            min-width: 450px;
            min-height: 1000px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            padding: 0 24px 10px 24px;
            box-sizing: border-box;
            overflow: hidden;
            transform-origin: center center;
            
            border: 2px solid #2e384c;
            border-radius: 26px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* نوار وضعیت گوشی */
        .phone-status-bar {
            height: 42px;
            padding: 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d6d6d6;
            direction: rtl;
            user-select: none;
            flex-shrink: 0;
        }

        .status-time {
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #ffffff;
            font-weight: 600;
            direction: ltr;
        }

        .status-icons-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 21px;
        }

        .status-icons-img {
            height: 21px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* هدر رسید - با فاصله بیشتر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0 28px 0;
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .back-btn svg {
            stroke: #4289df;
            width: 26px;
            height: 26px;
        }

        .header-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
        }

        .help-btn {
            background-color: var(--help-bg);
            color: var(--bg-color);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
        }

        /* بخش بالای باکس - سر جای خودش */
        .top-fixed {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding-bottom: 15px;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .avatar-wrapper {
            width: 80px;
            height: 80px;
            background-color: #242a37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .avatar-img {
            width: 62%;
            height: 62%;
            object-fit: contain;
            display: block;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
            text-align: center;
        }

        .profile-card {
            font-size: 16px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 14px;
            direction: ltr;
            font-weight: 500;
        }

        .amount-section {
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .amount {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 2px;
            color: var(--text-main);
        }

        .amount-label {
            font-size: 15px;
            color: var(--text-muted);
        }

        /* بج انتقال موفق */
        .status-badge-container {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .status-badge {
            background-color: var(--accent-green);
            color: #07231a;
            border-radius: 12px;
            padding: 9px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-badge-text {
            color: #07231a;
            font-size: 15.5px;
            font-weight: 700;
            line-height: 1;
        }

        .status-icon-circle {
            background-color: #07231a;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-icon-circle svg {
            width: 13px;
            height: 13px;
        }

        /* خط نقطه‌چین بالای زمان - تعداد نقطه‌ها کمتر */
        .dotted-sep {
            margin: 0 4px 6px 4px;
            opacity: 0.85;
            flex-shrink: 0;
            background-image: radial-gradient(circle, #363e4f 1.5px, transparent 1.5px);
            background-size: 20px 3px;
            background-repeat: repeat-x;
            background-position: bottom;
            height: 3px;
        }

        /* فاصله بالا برای وسط‌چین کردن لیست جزئیات */
        .spacer-top {
            flex-grow: 1;
            min-height: 10px;
        }

        /* لیست مشخصات - این بخش وسط قرار می‌گیرد */
        .details-list {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 2px;
            border-bottom: 1px solid var(--line-color);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 15.5px;
            color: var(--text-muted);
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .ltr-text {
            direction: ltr;
        }

        /* فاصله پایین برای وسط‌چین کردن لیست جزئیات */
        .spacer-bottom {
            flex-grow: 1;
            min-height: 10px;
        }

        /* دکمه‌های ظاهری پایین */
        .bottom-actions {
            display: flex;
            gap: 14px;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .action-btn {
            flex: 1;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 14px;
            padding: 14px 6px;
            color: var(--btn-text);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            pointer-events: none;
        }

        .action-btn svg {
            width: 25px;
            height: 25px;
            stroke: var(--btn-text);
            stroke-width: 1.8;
            fill: none;
        }

        .home-indicator {
            width: 134px;
            height: 4.5px;
            background-color: #ffffff;
            opacity: 0.45;
            border-radius: 3px;
            margin: 8px auto 2px auto;
            flex-shrink: 0;
        }

        /* دکمه آبی شناور ذخیره عکس */
        .floating-download-bar {
            width: 100%;
            background: #141720;
            border-top: 1px solid #232938;
            padding: 10px 16px;
            display: flex;
            z-index: 100;
            flex-shrink: 0;
        }

        .blue-save-btn {
            width: 100%;
            background-color: #2563EB;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }

        .blue-save-btn:active {
            transform: scale(0.98);
        }

        .blue-save-btn svg {
            width: 21px;
            height: 21px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <!-- فرم ورود اطلاعات بدون هیچ placeholder و بدون اسکرول -->
        <div id="form-view">
            <div class="form-top-bar">
                <a href="../index.html" class="back-home-btn" title="بازگشت به انتخاب اپلیکیشن">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
                <div style="width: 40px;"></div>
            </div>

            <div class="form-header">
                <h2>صدور رسید بلو بانک</h2>
                <p>مشخصات تراکنش را جهت دریافت تصویر وارد کنید</p>
            </div>

            <form id="transaction-form" onsubmit="handleFormSubmit(event)" autocomplete="off">
                <div class="form-group">
                    <label>شماره کارت مقصد</label>
                    <input type="text" id="input-dest-card" maxlength="19" required dir="ltr">
                </div>

                <div class="form-group">
                    <label>نام دارنده کارت مقصد</label>
                    <input type="text" id="input-dest-name" required>
                </div>

                <div class="form-group">
                    <label>مبلغ (ریال)</label>
                    <input type="text" id="input-amount" required dir="ltr">
                </div>

                <div class="form-group">
                    <label>شماره کارت مبدأ</label>
                    <div class="input-with-btn">
                        <input type="text" id="input-src-card" maxlength="19" required dir="ltr">
                        <button type="button" class="dice-btn" id="dice-btn" title="تولید شماره کارت تصادفی">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7c.83 0 1.5.67 1.5 1.5S7.83 10 7 10s-1.5-.67-1.5-1.5S6.17 7 7 7zm0 10c-.83 0-1.5-.67-1.5-1.5S6.17 14 7 14s1.5.67 1.5 1.5S7.83 17 7 17zm5-5c-.83 0-1.5-.67-1.5-1.5S11.17 9 12 9s1.5.67 1.5 1.5S12.83 12 12 12zm5 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-10c-.83 0-1.5-.67-1.5-1.5S16.17 7 17 7s1.5.67 1.5 1.5S17.83 10 17 10z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>نام دارنده کارت مبدأ</label>
                    <input type="text" id="input-src-name" required>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">تأیید و صدور رسید</button>
            </form>
        </div>

        <!-- نمای رسید و دانلود -->
        <div id="receipt-wrapper">
            
            <div class="preview-outer" id="preview-outer">
                <!-- المان رسید 450x1000 (نسبت ۹:۲۰) -->
                <div id="receipt-capture-area">

                    <!-- نوار وضعیت گوشی -->
                    <div class="phone-status-bar">
                        <span class="status-time" id="status-clock">1:20</span>
                        <div class="status-icons-wrapper">
                            <img src="../images/status-icons.png" class="status-icons-img" alt="status" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div style="display:none; align-items:center; gap:5px; height:21px;">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
                                <svg width="18" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h-3V2h-4v2H7v18h10V4z"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- هدر رسید - با فاصله بیشتر -->
                    <div class="header">
                        <div class="help-btn">?</div>
                        <div class="header-title">رسید</div>
                        <button class="back-btn" onclick="showForm()" title="بازگشت">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>

                    <!-- بخش بالای باکس - سر جای خودش -->
                    <div class="top-fixed">
                        <!-- مشخصات پروفایل -->
                        <div class="profile-section">
                            <div class="avatar-wrapper">
                                <img src="../images/blu.png" alt="آواتار بلو" class="avatar-img" onerror="this.onerror=null; this.src='images/blu.png';">
                            </div>
                            <div class="profile-name" id="display-name">---</div>
                            <div class="profile-card" id="display-card">---</div>
                        </div>

                        <div class="amount-section">
                            <div class="amount" id="display-amount">---</div>
                            <div class="amount-label">مبلغ انتقال</div>
                        </div>

                        <!-- بج انتقال موفق -->
                        <div class="status-badge-container">
                            <div class="status-badge">
                                <div class="status-icon-circle">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="#02bd92" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                                <span class="status-badge-text">انتقال موفق</span>
                            </div>
                        </div>
                    </div>

                    <!-- فاصله بالا برای وسط‌چین کردن لیست جزئیات -->
                    <div class="spacer-top"></div>

                    <!-- لیست مشخصات - این بخش وسط قرار می‌گیرد -->
                    <div class="details-list">
                        <!-- خط نقطه‌چین دقیقاً بالای زمان -->
                        <div class="dotted-sep"></div>
                        <div class="detail-row">
                            <div class="detail-label">زمان</div>
                            <div class="detail-value" id="display-date">---</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">انتقال دهنده</div>
                            <div class="detail-value" id="display-src-name">---</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">روش انتقال</div>
                            <div class="detail-value">کارت به کارت</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">کارت مبدا</div>
                            <div class="detail-value ltr-text" id="display-src-card">---</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">شماره مرجع</div>
                            <div class="detail-value ltr-text" id="display-ref-num">---</div>
                        </div>
                    </div>

                    <!-- فاصله پایین برای وسط‌چین کردن لیست جزئیات -->
                    <div class="spacer-bottom"></div>

                    <!-- دکمه‌های پایینی رسید -->
                    <div class="bottom-actions">
                        <div class="action-btn">
                            <svg viewBox="0 0 24 24">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                            <span>اشتراک‌گذاری</span>
                        </div>
                        <div class="action-btn">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <span>ذخیره در گالری</span>
                        </div>
                    </div>

                    <!-- خط نشانگر هوم -->
                    <div class="home-indicator"></div>
                </div>
            </div>

            <!-- دکمه آبی شناور ذخیره عکس -->
            <div class="floating-download-bar">
                <button class="blue-save-btn" id="btn-save-receipt" onclick="downloadReceiptImage()">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span> ذخیره رسید </span>
                </button>
            </div>

        </div>

    </div>

    <script>
        function toPersianDigits(str) {
            if (!str) return '';
            const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return str.toString().replace(/\d/g, x => farsiDigits[x]);
        }

        function toEnglishDigits(str) {
            if (!str) return '';
            return str.toString().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
        }

        function cleanCardNumber(str) {
            if (!str) return '';
            return toEnglishDigits(str).replace(/[\s\-]/g, '').replace(/\D/g, '');
        }

        document.getElementById('input-amount').addEventListener('input', function (e) {
            let cleanDigits = toEnglishDigits(e.target.value).replace(/\D/g, '');
            if (cleanDigits) {
                let formatted = cleanDigits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                e.target.value = toPersianDigits(formatted);
            } else {
                e.target.value = '';
            }
        });

        ['input-dest-card', 'input-src-card'].forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                let val = toEnglishDigits(e.target.value).replace(/\D/g, '').substring(0, 16);
                let formatted = val.match(/.{1,4}/g)?.join(' ') || '';
                e.target.value = toPersianDigits(formatted);
            });
        });

        document.getElementById('dice-btn').addEventListener('click', function () {
            let randomCard = '6037';
            for (let i = 0; i < 12; i++) {
                randomCard += Math.floor(Math.random() * 10);
            }
            let formatted = randomCard.match(/.{1,4}/g).join(' ');
            document.getElementById('input-src-card').value = toPersianDigits(formatted);
        });

        function getCurrentPersianDateTime() {
            const now = new Date();
            const formatterDate = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            const dateParts = formatterDate.formatToParts(now);
            
            const weekday = dateParts.find(p => p.type === 'weekday').value;
            const day = dateParts.find(p => p.type === 'day').value;
            const month = dateParts.find(p => p.type === 'month').value;
            const year = dateParts.find(p => p.type === 'year').value;

            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('status-clock').innerText = `${hours}:${minutes}`;

            return toPersianDigits(`${hours}:${minutes} ${weekday}، ${day} ${month} ${year}`);
        }

        function generateRandomNumber(length) {
            let result = '';
            for (let i = 0; i < length; i++) {
                result += Math.floor(Math.random() * 10);
            }
            return toPersianDigits(result);
        }

        function maskCardNumber(cardStr) {
            let clean = cleanCardNumber(cardStr);
            if (clean.length >= 10) {
                let p1 = clean.substring(0, 4);
                let p2 = clean.substring(4, 6);
                let p3 = clean.substring(clean.length - 4);
                return `${toPersianDigits(p1)}  ${toPersianDigits(p2)}** **** ${toPersianDigits(p3)}`;
            }
            return toPersianDigits(clean);
        }

        function fitPreviewInScreen() {
            const container = document.getElementById('preview-outer');
            const target = document.getElementById('receipt-capture-area');
            if (!container || !target) return;
            const scale = Math.min(container.clientWidth / 450, container.clientHeight / 1000);
            target.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', fitPreviewInScreen);

        function handleFormSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'درحال آماده‌سازی...';

            setTimeout(() => {
                const destName = document.getElementById('input-dest-name').value;
                const destCard = cleanCardNumber(document.getElementById('input-dest-card').value);
                const amount = document.getElementById('input-amount').value;
                const srcCard = cleanCardNumber(document.getElementById('input-src-card').value);
                const srcName = document.getElementById('input-src-name').value;

                document.getElementById('display-name').innerText = destName;
                document.getElementById('display-card').innerText = toPersianDigits(destCard.match(/.{1,4}/g)?.join('  ') || destCard);
                document.getElementById('display-amount').innerText = `${amount} ریال`;
                document.getElementById('display-date').innerText = getCurrentPersianDateTime();
                document.getElementById('display-src-name').innerText = srcName;
                document.getElementById('display-src-card').innerText = maskCardNumber(srcCard);
                document.getElementById('display-ref-num').innerText = generateRandomNumber(12);

                document.getElementById('form-view').style.display = 'none';
                document.getElementById('receipt-wrapper').style.display = 'flex';
                
                fitPreviewInScreen();

                submitBtn.disabled = false;
                submitBtn.innerText = 'تأیید و صدور رسید';
            }, 250);
        }

        function showForm() {
            document.getElementById('receipt-wrapper').style.display = 'none';
            document.getElementById('form-view').style.display = 'flex';
        }

        async function downloadReceiptImage() {
            const btn = document.getElementById('btn-save-receipt');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<span>درحال ساخت تصویر...</span>';
            btn.style.opacity = '0.7';

            const receiptNode = document.getElementById('receipt-capture-area');
            const currentTransform = receiptNode.style.transform;
            
            receiptNode.style.transform = 'none';
            receiptNode.style.border = 'none';
            receiptNode.style.borderRadius = '0';
            receiptNode.style.boxShadow = 'none';

            try {
                if (document.fonts) {
                    await document.fonts.ready;
                }

                const canvas = await html2canvas(receiptNode, {
                    scale: 2.4,
                    width: 450,
                    height: 1000,
                    windowWidth: 450,
                    windowHeight: 1000,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#1a1e29',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `blu-receipt-${Date.now()}.png`;
                link.href = imgData;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                alert('خطا در دانلود تصویر رسید: ' + err.message);
            } finally {
                receiptNode.style.transform = currentTransform;
                receiptNode.style.border = '2px solid #2e384c';
                receiptNode.style.borderRadius = '26px';
                receiptNode.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05)';
                btn.innerHTML = originalBtnText;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
